<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Empathy experiment: motion through an occluded region</title>
  <desc id="desc">A ball follows a visible trajectory into an occluder. Several pale belief trajectories occupy the hidden region around the ground-truth path. The ball exits and continues visibly. Gravity, wind, and damping define the fixed world.</desc>
  <rect width="1200" height="620" rx="18" fill="#eee9df"/>
  <rect x="24" y="24" width="1152" height="572" rx="12" fill="#f4f0e7" stroke="#b8b5aa"/>

  <text x="60" y="76" fill="#38413a" font-family="Georgia, serif" font-size="28">The experiment</text>
  <text x="1140" y="73" text-anchor="end" fill="#788078" font-family="ui-monospace, monospace" font-size="15">gravity −0.06 · wind 0.00 · damping 0.00</text>
  <line x1="60" y1="98" x2="1140" y2="98" stroke="#c7c3b9"/>

  <text x="110" y="144" fill="#7f837c" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">VISIBLE</text>
  <text x="528" y="144" fill="#7f837c" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">OCCLUDED</text>
  <text x="966" y="144" fill="#7f837c" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">VISIBLE</text>

  <rect x="432" y="164" width="332" height="326" fill="#d0cec5" stroke="#aaa99f"/>
  <text x="598" y="470" text-anchor="middle" fill="#777b75" font-family="Georgia, serif" font-size="15">the world continues, but perception does not</text>

  <g fill="none" stroke="#a8afa8" stroke-width="3" stroke-linecap="round" opacity="0.20">
    <path d="M432 286 C500 258 604 248 764 330"/>
    <path d="M432 286 C510 275 622 280 764 330"/>
    <path d="M432 286 C500 294 616 315 764 330"/>
    <path d="M432 286 C528 240 655 251 764 330"/>
    <path d="M432 286 C500 322 632 354 764 330"/>
    <path d="M432 286 C530 265 636 298 764 330"/>
    <path d="M432 286 C512 308 652 340 764 330"/>
  </g>
  <path d="M432 286 C545 282 650 302 764 330" fill="none" stroke="#59645b" stroke-width="2.2" stroke-dasharray="6 7" opacity="0.82"/>

  <g stroke="#59645b" stroke-width="4" stroke-linecap="round">
    <line x1="126" y1="378" x2="206" y2="368"/>
    <line x1="206" y1="368" x2="290" y2="344"/>
    <line x1="290" y1="344" x2="365" y2="314"/>
    <line x1="365" y1="314" x2="432" y2="286"/>
    <line x1="764" y1="330" x2="846" y2="348"/>
    <line x1="846" y1="348" x2="928" y2="376"/>
    <line x1="928" y1="376" x2="1008" y2="412"/>
    <line x1="1008" y1="412" x2="1084" y2="450"/>
  </g>

  <circle cx="126" cy="378" r="10" fill="#59645b" stroke="#f4f0e7" stroke-width="3"/>
  <circle cx="432" cy="286" r="7" fill="#59645b"/>
  <circle cx="764" cy="330" r="9" fill="#f4f0e7" stroke="#59645b" stroke-width="3"/>
  <circle cx="1084" cy="450" r="7" fill="#59645b"/>

  <g fill="#4b544c" font-family="Georgia, serif" font-size="17">
    <text x="86" y="416">initial condition</text>
    <text x="374" y="252">entry</text>
    <text x="778" y="304">exit</text>
    <text x="978" y="488">continued trajectory</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="14">
    <line x1="472" y1="524" x2="532" y2="524" stroke="#59645b" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="544" y="529" fill="#606760">ground truth</text>
    <line x1="672" y1="524" x2="732" y2="524" stroke="#a8afa8" stroke-width="7" opacity="0.34"/>
    <text x="744" y="529" fill="#606760">Model 1 beliefs</text>
  </g>

  <text x="600" y="574" text-anchor="middle" fill="#788078" font-family="Georgia, serif" font-size="16">Model 1 predicts through the gap · Model 2 asks which world would produce those predictions</text>
</svg>
