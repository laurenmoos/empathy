<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empathy</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ece8df;
      --ink: #333832;
      --muted: #777970;
      --forest: #3d433d;
      --forest-muted: #d0d1cb;
      --canvas: #dbd8d0;
      --belief: #8b9186;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { padding: 1rem 1.35rem; color: #f2efe7; background: var(--forest); text-align: center; }
    h1 { margin: 0; font: 500 1.18rem/1.1 Georgia, serif; letter-spacing: -.02em; }
    main { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: calc(100vh - 3.2rem); }
    aside { padding: 1.35rem; color: #f2efe7; background: var(--forest); }
    h2 { margin: 0; font: 500 .95rem/1.2 Georgia, serif; }
    aside h2 { margin-bottom: 1.35rem; }
    .control { display: grid; grid-template-columns: 1fr 4.8rem; align-items: center; gap: .8rem; margin-top: .9rem; color: var(--forest-muted); font-size: .72rem; }
    input[type="number"] {
      width: 100%;
      padding: .48rem .55rem;
      color: #f2efe7;
      background: rgb(242 239 231 / 6%);
      border: 0;
      border-radius: 2px;
      font: 650 .72rem ui-monospace, monospace;
    }
    button {
      width: 100%;
      padding: .62rem .7rem;
      color: var(--forest-muted);
      background: transparent;
      border: 1px solid #737a73;
      border-radius: 2px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { color: var(--forest); background: #d9d9d1; border-color: transparent; }
    button:disabled { cursor: wait; opacity: .6; }
    .buttons { display: grid; gap: .45rem; margin-top: .9rem; }
    .status { min-height: 3.6em; margin: .65rem 0 0; color: #aeb2aa; font-size: .7rem; line-height: 1.4; }
    .status:empty { display: none; }
    .layers {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(17rem, .7fr);
      gap: 1.4rem;
      padding: 1.5rem;
      align-items: start;
    }
    .panel {
      min-width: 0;
      padding-top: .75rem;
      background: transparent;
    }
    .panel-head { min-height: 2.5rem; margin-bottom: .65rem; }
    .panel-head span { display: block; margin-top: .25rem; color: var(--muted); font-size: .68rem; line-height: 1.35; }
    canvas { display: block; width: 100%; aspect-ratio: 1.2; background: var(--canvas); }
    .comparison { display: grid; gap: 1rem; margin-top: .35rem; }
    .posterior-row { display: grid; gap: .42rem; padding: .25rem 0; }
    .posterior-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .posterior-name { font: 500 .72rem Georgia, serif; }
    .posterior-values { display: flex; align-items: baseline; gap: .55rem; font-variant-numeric: tabular-nums; }
    .posterior-estimate { font: 500 .7rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .posterior-range { color: var(--muted); font: 400 .6rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .posterior-axis { position: relative; height: 1.05rem; }
    .posterior-track { position: absolute; top: .5rem; right: 0; left: 0; height: 1px; background: rgb(61 67 61 / 14%); }
    .posterior-band { position: absolute; top: .4rem; height: .2rem; border-radius: 1rem; background: rgb(111 126 109 / 34%); }
    .posterior-particle { position: absolute; top: .4rem; width: .2rem; height: .2rem; border-radius: 50%; background: #758073; transform: translateX(-.1rem); }
    .posterior-mean { position: absolute; top: .18rem; width: 2px; height: .68rem; background: var(--forest); transform: translateX(-1px); }
    .posterior-truth { position: absolute; top: .39rem; width: .28rem; height: .28rem; border: 1px solid var(--forest); border-radius: 50%; background: var(--paper); transform: translateX(-.14rem); }
    .hypothesis-list { display: grid; gap: .35rem; margin-top: .45rem; }
    .hypothesis-heading, .hypothesis-row { display: grid; grid-template-columns: minmax(5.5rem, 1fr) repeat(3, 3.15rem); align-items: baseline; gap: .3rem; }
    .hypothesis-title { color: var(--muted); font: 400 .62rem Georgia, serif; }
    .hypothesis-column { color: var(--muted); font: 400 .52rem ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .hypothesis-key { display: flex; align-items: baseline; gap: .45rem; font: 500 .64rem Georgia, serif; }
    .hypothesis-mass { color: var(--muted); font: 400 .56rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    .hypothesis-value { font: 500 .62rem ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 1080px) {
      .layers { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      .layers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header><h1>Empathy</h1></header>
  <main>
    <aside>
      <h2>Fixed world</h2>
      <label class="control">
        <span>Gravity</span>
        <input id="gravity" type="number" min="-0.30" max="0.30" step="0.02" value="-0.06">
      </label>
      <label class="control">
        <span>Wind</span>
        <input id="wind" type="number" min="-0.30" max="0.30" step="0.05" value="0.00">
      </label>
      <label class="control">
        <span>Damping</span>
        <input id="damping" type="number" min="0" max="0.60" step="0.05" value="0.00">
      </label>
      <div class="buttons">
        <button class="primary" id="streamToggle">Throw the ball</button>
      </div>
      <p class="status" id="statusMessage"></p>
    </aside>

    <section class="layers">
      <article class="panel" id="perceptionPanel">
        <div class="panel-head">
          <h2>Seeing</h2>
        </div>
        <canvas id="perceptionCanvas" width="768" height="640"></canvas>
      </article>

      <article class="panel" id="secondOrderPanel">
        <div class="panel-head">
          <h2>Thinking</h2>
        </div>
        <div class="comparison">
          <div id="comparisonRows"></div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const perceptionCanvas = $("perceptionCanvas");
    const perceptionCtx = perceptionCanvas.getContext("2d");
    const EXPECTED_THOUGHT_LABELS = [
      "first possibility",
      "more possibilities",
      "full belief",
      "reappearance revision"
    ];
    const DEFAULT_OCCLUDER = [0.35, 0.55, 0.05, 0.95];
    const FRAME_INTERVAL_SECONDS = .004;
    const HIDDEN_FRAME_INTERVAL_SECONDS = .025;
    const worldSlots = [
      {name: "gravity", operator: "vertical_acceleration", parameter: "a_y", parameterIndex: 0, posteriorIndex: 0, minimum: -0.30, maximum: 0.30},
      {name: "wind", operator: "horizontal_acceleration", parameter: "a_x", parameterIndex: 1, posteriorIndex: 1, minimum: -0.30, maximum: 0.30},
      {name: "damping", operator: "damping", parameter: "lambda", parameterIndex: 2, posteriorIndex: 2, minimum: 0, maximum: 0.60}
    ];

    let sessionId = null;
    let episodeQueue = [];
    let currentEpisode = null;
    let currentFrame = 0;
    let currentThought = -1;
    let playing = false;
    let fetching = false;
    let requestSerial = 0;
    let accumulator = 0;
    let previousTimestamp = 0;

    function decodeBytes(encoded) {
      const raw = atob(encoded);
      return Uint8Array.from(raw, character => character.charCodeAt(0));
    }

    function validateWorldVector(value, name) {
      if (!Array.isArray(value) || value.length !== 12 || !value.every(Number.isFinite)) {
        throw new Error(`${name} must be a finite 12-value world vector`);
      }
    }

    function fallbackConstraintRecovery(actual, predicted) {
      const constraints = worldSlots.map(slot => {
        const actualOperator = actual[slot.operator];
        const predictedOperator = predicted[slot.operator];
        const actualActive = Boolean(actualOperator && actualOperator.active);
        const predictedActive = Boolean(predictedOperator && predictedOperator.active);
        const activityMatch = actualActive === predictedActive;
        const actualValue = actualActive
          ? Number(actualOperator.parameters[slot.parameter]) : 0;
        const predictedValue = predictedActive
          ? Number(predictedOperator.parameters[slot.parameter]) : 0;
        const parameterError = Math.abs(actualValue - predictedValue)
          / (slot.maximum - slot.minimum);
        const closeness = Math.max(0, Math.min(1, 1 - parameterError));
        const recovered = activityMatch && parameterError <= .10;
        return {
          name: slot.name,
          recovered,
          activity_match: activityMatch,
          parameter_error: actualActive || predictedActive ? parameterError : null,
          closeness
        };
      });
      const recovered = constraints.filter(item => item.recovered).length;
      const score = constraints.reduce((sum, item) => sum + item.closeness, 0)
        / constraints.length;
      return {recovered, total: constraints.length, score, constraints};
    }

    function validateLiveEpisode(payload) {
      if (!payload || payload.schema_version !== "live-thinking-v1") {
        throw new Error("episode response must use the live thinking v1 schema");
      }
      if (!Number.isInteger(payload.episode_index)
          || !Array.isArray(payload.initial_state)
          || payload.initial_state.length !== 4
          || !payload.initial_state.every(Number.isFinite)) {
        throw new Error("episode index and initial_state are invalid");
      }
      if (!Number.isInteger(payload.model1_checkpoint_version)
          || payload.model1_checkpoint_version < 1
          || (payload.model2_checkpoint_version !== null
            && (!Number.isInteger(payload.model2_checkpoint_version)
              || payload.model2_checkpoint_version < 1
              || payload.model2_checkpoint_version > payload.model1_checkpoint_version))) {
        throw new Error("checkpoint versions are invalid");
      }
      const truth = payload.ground_truth;
      if (!truth || ![truth.width, truth.height, truth.frame_count].every(Number.isInteger)) {
        throw new Error("ground-truth dimensions must be integers");
      }
      if (!Array.isArray(truth.path) || truth.path.length < 2
          || !truth.path.every(point => Array.isArray(point)
            && point.length === 2
            && point.every(value => Number.isFinite(value) && value >= 0 && value <= 1))) {
        throw new Error("ground-truth path must contain normalized x/y points");
      }
      if (!Number.isInteger(truth.hidden_start)
          || !Number.isInteger(truth.hidden_end)
          || !Number.isInteger(truth.reappearance_step)
          || truth.hidden_start < 0
          || truth.hidden_start > truth.hidden_end
          || truth.hidden_end >= truth.reappearance_step
          || truth.reappearance_step >= truth.frame_count) {
        throw new Error("hidden interval and reappearance must index the clip");
      }
      validateWorldVector(truth.world_flat, "actual world");
      const occluder = truth.occluder ?? DEFAULT_OCCLUDER;
      if (!Array.isArray(occluder) || occluder.length !== 4
          || !occluder.every(value => Number.isFinite(value)
            && value >= 0 && value <= 1)
          || occluder[0] >= occluder[1]
          || occluder[2] >= occluder[3]) {
        throw new Error("ground-truth occluder must contain four normalized values");
      }
      if (!Array.isArray(payload.thought_steps) || payload.thought_steps.length !== 4) {
        throw new Error("episode must contain four thought steps");
      }
      const thoughtSteps = payload.thought_steps.map((step, index) => {
        if (!step || step.label !== EXPECTED_THOUGHT_LABELS[index]
            || !Number.isInteger(step.width) || !Number.isInteger(step.height)) {
          throw new Error("thought step order or dimensions are invalid");
        }
        validateWorldVector(step.predicted_world_flat, "predicted world");
        if (!Array.isArray(step.predicted_parameters)
            || step.predicted_parameters.length !== 7
            || !step.predicted_parameters.every(Number.isFinite)) {
          throw new Error("predicted parameters must contain seven finite values");
        }
        const posterior = step.parameter_posterior;
        if (posterior !== null) {
          if (!posterior || !Array.isArray(posterior.particles)
              || posterior.particles.length < 1
              || !posterior.particles.every(particle => Array.isArray(particle)
                && particle.length === 3 && particle.every(Number.isFinite))
              || !Array.isArray(posterior.weights)
              || posterior.weights.length !== posterior.particles.length
              || !posterior.weights.every(weight => Number.isFinite(weight) && weight >= 0)
              || posterior.weights.reduce((sum, weight) => sum + weight, 0) <= 0) {
            throw new Error("posterior particles and weights are invalid");
          }
          if (!Array.isArray(posterior.mean) || posterior.mean.length !== 3
              || !posterior.mean.every(Number.isFinite)
              || !Array.isArray(posterior.intervals)
              || posterior.intervals.length !== 3
              || !posterior.intervals.every(interval => Array.isArray(interval)
                && interval.length === 2 && interval.every(Number.isFinite)
                && interval[0] <= interval[1])
              || !Number.isInteger(posterior.update_count)
              || posterior.update_count < 1) {
            throw new Error("posterior intervals or mean are invalid");
          }
          if (!Array.isArray(posterior.hypotheses)
              || posterior.hypotheses.length < 1 || posterior.hypotheses.length > 3
              || !posterior.hypotheses.every(hypothesis => hypothesis
                && Array.isArray(hypothesis.parameters)
                && hypothesis.parameters.length === 3
                && hypothesis.parameters.every(Number.isFinite)
                && Number.isFinite(hypothesis.weight)
                && hypothesis.weight > 0 && hypothesis.weight <= 1)
              || Math.abs(posterior.hypotheses.reduce(
                (sum, hypothesis) => sum + hypothesis.weight, 0
              ) - 1) > 1e-4) {
            throw new Error("posterior hypotheses are invalid");
          }
        }
        if (!Array.isArray(step.paths) || step.paths.length < 1
            || !step.paths.every(path => Array.isArray(path) && path.length > 1
              && path.every(point => Array.isArray(point) && point.length === 2
                && point.every(value => Number.isFinite(value)
                  && value >= 0 && value <= 1)))
            || !Array.isArray(step.path_weights)
            || step.path_weights.length !== step.paths.length
            || !step.path_weights.every(value => Number.isFinite(value) && value >= 0)) {
          throw new Error("belief paths and weights are invalid");
        }
        const beliefBytes = decodeBytes(step.belief_u8);
        if (beliefBytes.length !== step.width * step.height) {
          throw new Error("belief byte length does not match dimensions");
        }
        const fallbackRecovery = fallbackConstraintRecovery(truth.operators, step.operators);
        const recovery = step.constraint_recovery
          && step.constraint_recovery.constraints?.every(item => Number.isFinite(item.closeness))
          ? step.constraint_recovery : fallbackRecovery;
        if (!recovery || !Number.isInteger(recovery.recovered)
            || recovery.total !== 3 || recovery.recovered < 0
            || recovery.recovered > recovery.total
            || !Number.isFinite(recovery.score) || recovery.score < 0 || recovery.score > 1
            || !Array.isArray(recovery.constraints) || recovery.constraints.length !== 3
            || !recovery.constraints.every((item, constraintIndex) =>
              item.name === worldSlots[constraintIndex].name
              && typeof item.recovered === "boolean"
              && typeof item.activity_match === "boolean"
              && Number.isFinite(item.closeness)
              && item.closeness >= 0 && item.closeness <= 1
              && (item.parameter_error === null
                || Number.isFinite(item.parameter_error) && item.parameter_error >= 0))) {
          throw new Error("constraint recovery is invalid");
        }
        return {...step, beliefBytes, constraint_recovery: recovery, parameter_posterior: posterior};
      });
      if (!payload.training || !Number.isFinite(payload.training.loss)
          || !Number.isInteger(payload.latent_update_count)
          || !Number.isInteger(payload.weight_update_count)) {
        throw new Error("online update metadata is invalid");
      }
      return {
        ...payload,
        ground_truth: {...truth, occluder},
        thought_steps: thoughtSteps
      };
    }

    function selectedParameters() {
      return {
        gravity: Number($("gravity").value),
        wind: Number($("wind").value),
        damping: Number($("damping").value)
      };
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `request failed: ${response.status}`);
      return payload;
    }

    async function startSession() {
      const serial = ++requestSerial;
      sessionId = null;
      episodeQueue.length = 0;
      currentEpisode = null;
      currentFrame = 0;
      currentThought = -1;
      playing = false;
      fetching = false;
      $("statusMessage").textContent = "";
      clearAllLayers();
      $("streamToggle").disabled = true;
      try {
        const payload = await postJson("/api/session/start", selectedParameters());
        if (serial !== requestSerial) return;
        if (payload.schema_version !== "live-session-v1" || typeof payload.session_id !== "string") {
          throw new Error("session response is invalid");
        }
        sessionId = payload.session_id;
        playing = true;
        await requestNextEpisode();
      } catch (error) {
        if (serial !== requestSerial) return;
        playing = false;
        sessionId = null;
        $("statusMessage").textContent = `Couldn’t start the stream: ${error.message}`;
      } finally {
        if (serial === requestSerial) $("streamToggle").disabled = false;
        updateControls();
      }
    }

    async function requestNextEpisode() {
      if (!sessionId || fetching) return;
      const serial = requestSerial;
      const targetSession = sessionId;
      fetching = true;
      try {
        const payload = await postJson("/api/session/next", {session_id: targetSession});
        if (serial !== requestSerial || targetSession !== sessionId) return;
        const episode = validateLiveEpisode(payload);
        if (!currentEpisode) setCurrentEpisode(episode);
        else episodeQueue.push(episode);
      } catch (error) {
        if (serial !== requestSerial) return;
        playing = false;
        $("statusMessage").textContent = `Stream stopped: ${error.message}`;
      } finally {
        if (serial === requestSerial) fetching = false;
        updateControls();
      }
    }

    function setCurrentEpisode(episode) {
      currentEpisode = episode;
      currentFrame = 0;
      currentThought = -1;
      accumulator = 0;
      draw();
      requestNextEpisode();
    }

    function advanceEpisode() {
      if (episodeQueue.length) {
        setCurrentEpisode(episodeQueue.shift());
        return;
      }
      requestNextEpisode();
    }

    function clearPerceptionCanvas() {
      perceptionCtx.fillStyle = "#dbd8d0";
      perceptionCtx.fillRect(0, 0, perceptionCanvas.width, perceptionCanvas.height);
    }

    function clearSecondOrder() {
      $("comparisonRows").replaceChildren();
    }

    function clearAllLayers() {
      clearPerceptionCanvas();
      clearSecondOrder();
    }

    function drawGroundTruthPath(path) {
      if (path.length < 2) return;
      perceptionCtx.save();
      perceptionCtx.beginPath();
      path.forEach(([x, y], index) => {
        const px = x * perceptionCanvas.width;
        const py = (1 - y) * perceptionCanvas.height;
        if (index === 0) perceptionCtx.moveTo(px, py);
        else perceptionCtx.lineTo(px, py);
      });
      perceptionCtx.strokeStyle = "#4f554f";
      perceptionCtx.lineWidth = 1.25;
      perceptionCtx.globalAlpha = .92;
      perceptionCtx.lineCap = "round";
      perceptionCtx.lineJoin = "round";
      perceptionCtx.stroke();
      perceptionCtx.restore();
    }

    function drawOccluder([xMin, xMax, yMin, yMax]) {
      perceptionCtx.save();
      perceptionCtx.fillStyle = "rgba(61, 67, 61, .16)";
      perceptionCtx.strokeStyle = "rgba(61, 67, 61, .32)";
      perceptionCtx.lineWidth = 1;
      const x = xMin * perceptionCanvas.width;
      const y = (1 - yMax) * perceptionCanvas.height;
      const width = (xMax - xMin) * perceptionCanvas.width;
      const height = (yMax - yMin) * perceptionCanvas.height;
      perceptionCtx.fillRect(x, y, width, height);
      perceptionCtx.strokeRect(x, y, width, height);
      perceptionCtx.restore();
    }

    function clipToOccluder([xMin, xMax, yMin, yMax], draw) {
      perceptionCtx.save();
      perceptionCtx.beginPath();
      perceptionCtx.rect(
        xMin * perceptionCanvas.width,
        (1 - yMax) * perceptionCanvas.height,
        (xMax - xMin) * perceptionCanvas.width,
        (yMax - yMin) * perceptionCanvas.height
      );
      perceptionCtx.clip();
      try {
        draw();
      } finally {
        perceptionCtx.restore();
      }
    }

    function boundaryPoint(path, boundaryX) {
      for (let index = 1; index < path.length; index += 1) {
        const [previousX, previousY] = path[index - 1];
        const [currentX, currentY] = path[index];
        if ((previousX <= boundaryX && currentX >= boundaryX)
            || (previousX >= boundaryX && currentX <= boundaryX)) {
          const span = currentX - previousX;
          const amount = Math.abs(span) < 1e-9 ? 0 : (boundaryX - previousX) / span;
          return [boundaryX, previousY + amount * (currentY - previousY)];
        }
      }
      return null;
    }

    function drawPoint(point) {
      if (!point) return;
      const [x, y] = point;
      perceptionCtx.beginPath();
      perceptionCtx.arc(
        x * perceptionCanvas.width,
        (1 - y) * perceptionCanvas.height,
        3,
        0,
        Math.PI * 2
      );
      perceptionCtx.fill();
      perceptionCtx.stroke();
    }

    function drawInitialPoint([x, y]) {
      perceptionCtx.save();
      perceptionCtx.fillStyle = "#4f554f";
      perceptionCtx.strokeStyle = "#4f554f";
      perceptionCtx.globalAlpha = .9;
      perceptionCtx.beginPath();
      perceptionCtx.arc(
        x * perceptionCanvas.width,
        (1 - y) * perceptionCanvas.height,
        4,
        0,
        Math.PI * 2
      );
      perceptionCtx.fill();
      perceptionCtx.restore();
    }

    function drawEntryExitPoints(truth) {
      const entry = boundaryPoint(truth.path, truth.occluder[0]);
      const exit = boundaryPoint(truth.path, truth.occluder[1]);
      perceptionCtx.save();
      perceptionCtx.fillStyle = "#dbd8d0";
      perceptionCtx.strokeStyle = "#4f554f";
      perceptionCtx.lineWidth = 1.2;
      if (currentFrame >= truth.hidden_start) drawPoint(entry);
      if (currentFrame >= truth.reappearance_step) drawPoint(exit);
      perceptionCtx.restore();
    }

    function drawObservedPath(path) {
      if (path.length < 2) return;
      perceptionCtx.save();
      perceptionCtx.beginPath();
      path.forEach(([x, y], index) => {
        const px = x * perceptionCanvas.width;
        const py = (1 - y) * perceptionCanvas.height;
        if (index === 0) perceptionCtx.moveTo(px, py);
        else perceptionCtx.lineTo(px, py);
      });
      perceptionCtx.strokeStyle = "#4f554f";
      perceptionCtx.lineWidth = 1.5;
      perceptionCtx.globalAlpha = .78;
      perceptionCtx.lineCap = "round";
      perceptionCtx.lineJoin = "round";
      perceptionCtx.stroke();
      perceptionCtx.restore();
    }

    function drawVisibleTrajectory(truth) {
      const entry = boundaryPoint(truth.path, truth.occluder[0]);
      const exit = boundaryPoint(truth.path, truth.occluder[1]);
      const approachEnd = Math.min(
        currentFrame,
        Math.max(0, truth.hidden_start - 1)
      );
      const approach = truth.path.slice(0, approachEnd + 1);
      if (currentFrame >= truth.hidden_start && entry) approach.push(entry);
      drawObservedPath(approach);

      if (currentFrame >= truth.reappearance_step) {
        const exitEnd = Math.min(currentFrame, truth.path.length - 1);
        const departure = truth.path.slice(truth.reappearance_step, exitEnd + 1);
        if (exit) departure.unshift(exit);
        drawObservedPath(departure);
      }
    }

    function weightedPredictionPath(step) {
      const length = Math.min(...step.paths.map(path => path.length));
      const total = step.path_weights.reduce((sum, weight) => sum + weight, 0);
      const weights = total > 0
        ? step.path_weights.map(weight => weight / total)
        : step.path_weights.map(() => 1 / step.path_weights.length);
      return Array.from({length}, (_, pointIndex) => {
        let x = 0;
        let y = 0;
        step.paths.forEach((path, pathIndex) => {
          x += path[pointIndex][0] * weights[pathIndex];
          y += path[pointIndex][1] * weights[pathIndex];
        });
        return [x, y];
      });
    }

    function drawPredictedPath(step) {
      const path = weightedPredictionPath(step);
      if (path.length < 2) return;
      perceptionCtx.save();
      perceptionCtx.beginPath();
      path.forEach(([x, y], index) => {
        const px = x * perceptionCanvas.width;
        const py = (1 - y) * perceptionCanvas.height;
        if (index === 0) perceptionCtx.moveTo(px, py);
        else perceptionCtx.lineTo(px, py);
      });
      perceptionCtx.strokeStyle = "#788076";
      perceptionCtx.lineWidth = 2.4;
      perceptionCtx.globalAlpha = .82;
      perceptionCtx.lineCap = "round";
      perceptionCtx.lineJoin = "round";
      perceptionCtx.stroke();
      perceptionCtx.restore();
    }

    function drawPerception() {
      if (!currentEpisode) return clearPerceptionCanvas();
      const truth = currentEpisode.ground_truth;
      perceptionCtx.fillStyle = "#dbd8d0";
      perceptionCtx.fillRect(0, 0, perceptionCanvas.width, perceptionCanvas.height);
      drawOccluder(truth.occluder);
      const index = thoughtIndex();
      if (index >= 0) {
        const step = currentEpisode.thought_steps[index];
        if (index !== currentThought) {
          currentThought = index;
          updateSecondOrder(step);
        }
      }
      const hidden = currentFrame >= truth.hidden_start
        && currentFrame < truth.reappearance_step;
      if (hidden) {
        const guess = currentEpisode.thought_steps[2];
        clipToOccluder(truth.occluder, () => {
          drawPredictedPath(guess);
          drawGroundTruthPath(truth.path);
        });
      }
      drawVisibleTrajectory(truth);
      drawInitialPoint(currentEpisode.initial_state);
      drawEntryExitPoints(truth);
    }

    function thoughtIndex() {
      if (!currentEpisode) return -1;
      const truth = currentEpisode.ground_truth;
      if (currentFrame < truth.hidden_start) return -1;
      if (currentFrame >= truth.reappearance_step) return 3;
      const hiddenLength = Math.max(1, truth.hidden_end - truth.hidden_start + 1);
      const progress = (currentFrame - truth.hidden_start) / hiddenLength;
      return Math.min(2, Math.floor(progress * 3));
    }

    function worldSlotNumber(operators, slot) {
      const operator = operators[slot.operator];
      if (!operator || !operator.active) return 0;
      return Number(operator.parameters[slot.parameter]);
    }

    function scalePercent(value, slot) {
      const fraction = (value - slot.minimum) / (slot.maximum - slot.minimum);
      return 100 * Math.max(0, Math.min(1, fraction));
    }

    function formatParameter(value) {
      const rounded = Math.abs(value) < .005 ? 0 : value;
      return rounded.toFixed(2).replace("-", "−");
    }

    function posteriorElements(actual, posterior) {
      const maximumWeight = Math.max(...posterior.weights, 1e-8);
      return worldSlots.map(slot => {
        const actualValue = worldSlotNumber(actual, slot);
        const [low, high] = posterior.intervals[slot.posteriorIndex];
        const estimate = posterior.mean[slot.posteriorIndex];
        const row = document.createElement("div");
        row.className = "posterior-row";
        const header = document.createElement("div");
        header.className = "posterior-header";
        const name = document.createElement("span");
        name.className = "posterior-name";
        name.textContent = slot.name;
        const values = document.createElement("span");
        values.className = "posterior-values";
        const estimateText = document.createElement("span");
        estimateText.className = "posterior-estimate";
        estimateText.textContent = formatParameter(estimate);
        const rangeText = document.createElement("span");
        rangeText.className = "posterior-range";
        rangeText.textContent = `${formatParameter(low)}–${formatParameter(high)}`;
        values.append(estimateText, rangeText);
        header.append(name, values);

        const axis = document.createElement("div");
        axis.className = "posterior-axis";
        axis.setAttribute("role", "img");
        axis.setAttribute(
          "aria-label",
          `${slot.name} posterior ${low.toFixed(2)} to ${high.toFixed(2)}, `
          + `mean ${estimate.toFixed(2)}, hidden world ${actualValue.toFixed(2)}`
        );
        const track = document.createElement("span");
        track.className = "posterior-track";
        const band = document.createElement("span");
        band.className = "posterior-band";
        band.style.left = `${scalePercent(low, slot)}%`;
        band.style.width = `${Math.max(.6, scalePercent(high, slot) - scalePercent(low, slot))}%`;
        axis.append(track, band);
        posterior.particles.forEach((particle, index) => {
          const mark = document.createElement("span");
          mark.className = "posterior-particle";
          mark.style.left = `${scalePercent(particle[slot.posteriorIndex], slot)}%`;
          mark.style.opacity = (.10 + .72 * Math.sqrt(
            posterior.weights[index] / maximumWeight
          )).toFixed(3);
          axis.append(mark);
        });
        const mean = document.createElement("span");
        mean.className = "posterior-mean";
        mean.style.left = `${scalePercent(estimate, slot)}%`;
        const truth = document.createElement("span");
        truth.className = "posterior-truth";
        truth.style.left = `${scalePercent(actualValue, slot)}%`;
        axis.append(mean, truth);
        row.append(header, axis);
        return row;
      });
    }

    function hypothesisElement(posterior) {
      const section = document.createElement("div");
      section.className = "hypothesis-list";
      const heading = document.createElement("div");
      heading.className = "hypothesis-heading";
      const title = document.createElement("span");
      title.className = "hypothesis-title";
      title.textContent = "possible worlds";
      heading.append(title);
      worldSlots.forEach(slot => {
        const label = document.createElement("span");
        label.className = "hypothesis-column";
        label.textContent = slot.name;
        heading.append(label);
      });
      section.append(heading);
      posterior.hypotheses.forEach((hypothesis, index) => {
        const row = document.createElement("div");
        row.className = "hypothesis-row";
        const key = document.createElement("span");
        key.className = "hypothesis-key";
        key.textContent = String.fromCharCode(65 + index);
        const mass = document.createElement("span");
        mass.className = "hypothesis-mass";
        mass.textContent = `${Math.round(100 * hypothesis.weight)}%`;
        key.append(mass);
        row.append(key);
        hypothesis.parameters.forEach(value => {
          const number = document.createElement("span");
          number.className = "hypothesis-value";
          number.textContent = formatParameter(value);
          row.append(number);
        });
        section.append(row);
      });
      return section;
    }

    function updateSecondOrder(step) {
      const posterior = step.parameter_posterior;
      if (!posterior) return clearSecondOrder();
      $("comparisonRows").replaceChildren(
        ...posteriorElements(currentEpisode.ground_truth.operators, posterior),
        hypothesisElement(posterior)
      );
    }

    function draw() {
      drawPerception();
    }

    function playbackInterval() {
      if (!currentEpisode) return FRAME_INTERVAL_SECONDS;
      const truth = currentEpisode.ground_truth;
      if (currentFrame >= truth.hidden_start
          && currentFrame < truth.reappearance_step) {
        return HIDDEN_FRAME_INTERVAL_SECONDS;
      }
      return FRAME_INTERVAL_SECONDS;
    }

    function animate(timestamp) {
      if (!previousTimestamp) previousTimestamp = timestamp;
      const elapsed = Math.min((timestamp - previousTimestamp) / 1000, .1);
      previousTimestamp = timestamp;
      if (playing && currentEpisode) {
        accumulator += elapsed;
        while (true) {
          const interval = playbackInterval();
          if (accumulator < interval) break;
          accumulator -= interval;
          if (currentFrame < currentEpisode.ground_truth.frame_count - 1) {
            currentFrame += 1;
            draw();
          } else {
            advanceEpisode();
          }
        }
      }
      requestAnimationFrame(animate);
    }

    function updateControls() {
      $("streamToggle").textContent = !sessionId
        ? "Throw the ball"
        : playing ? "Pause" : "Continue";
    }

    function stopAndClear() {
      const previousSession = sessionId;
      requestSerial += 1;
      sessionId = null;
      episodeQueue.length = 0;
      currentEpisode = null;
      currentFrame = 0;
      currentThought = -1;
      playing = false;
      fetching = false;
      clearPerceptionCanvas();
      clearSecondOrder();
      $("statusMessage").textContent = "";
      $("streamToggle").disabled = false;
      updateControls();
      if (previousSession) {
        postJson("/api/session/close", {session_id: previousSession}).catch(() => {});
      }
    }

    $("streamToggle").addEventListener("click", () => {
      if (!sessionId) {
        startSession();
        return;
      }
      playing = !playing;
      if (playing && !currentEpisode) requestNextEpisode();
      updateControls();
    });
    ["gravity", "wind", "damping"].forEach(id => {
      $(id).addEventListener("input", () => {
        stopAndClear();
      });
    });

    clearAllLayers();
    updateControls();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
