<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perception Environment Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #ecf6f5;
      --muted: #91a7aa;
      --panel: #101b1f;
      --line: rgba(174, 217, 216, .16);
      --aqua: #63e6d5;
      --violet: #ad92ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #091013;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { padding: 1rem 1.4rem; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 1.3rem; letter-spacing: -.03em; }
    main {
      display: grid;
      grid-template-columns: minmax(15rem, 18rem) minmax(0, 1fr);
      min-height: calc(100vh - 3.6rem);
    }
    aside {
      padding: 1rem;
      border-right: 1px solid var(--line);
      background: rgba(4, 11, 13, .35);
    }
    h2 { margin: 0; font-size: 1rem; }
    .intro { margin: .45rem 0 1rem; color: var(--muted); font-size: .78rem; line-height: 1.45; }
    label { display: grid; gap: .35rem; color: var(--muted); font-size: .75rem; }
    select, button {
      width: 100%;
      padding: .65rem .75rem;
      color: var(--ink);
      background: #18262a;
      border: 1px solid rgba(174, 217, 216, .22);
      border-radius: 9px;
      font: inherit;
    }
    button { cursor: pointer; font-weight: 700; }
    button.primary { color: #06201d; background: var(--aqua); border-color: transparent; }
    .buttons { display: grid; grid-template-columns: 1.35fr 1fr; gap: .45rem; margin-top: .7rem; }
    .status { min-height: 2.5em; margin: .7rem 0 0; color: var(--muted); font-size: .72rem; line-height: 1.35; }
    .model-two {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .model-two > small { display: block; margin: .45rem 0 .25rem; color: var(--muted); }
    .model-two > b { font: 650 .82rem ui-monospace, monospace; }
    .comparison { margin-top: .8rem; }
    .comparison-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: .35rem;
      padding: .45rem 0;
      border-top: 1px solid var(--line);
      font-size: .68rem;
    }
    .comparison-row.heading { color: var(--muted); border-top: 0; }
    .comparison-row span:not(:first-child) { font-family: ui-monospace, monospace; }
    .stage { padding: 1.2rem; }
    figure {
      margin: 0;
      padding: .9rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .1rem .2rem .75rem;
      font-size: .9rem;
    }
    figcaption span { color: var(--muted); font-size: .75rem; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 8;
      border-radius: 10px;
      background: #05090b;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: .75rem;
      color: var(--muted);
      font-size: .73rem;
    }
    .dot {
      display: inline-block;
      width: .65rem;
      height: .65rem;
      margin-right: .3rem;
      border-radius: 50%;
      vertical-align: -.05rem;
    }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .75rem; }
    .metric { padding: .75rem; border: 1px solid var(--line); border-radius: 10px; background: rgba(5, 12, 14, .6); }
    .metric small { display: block; margin-bottom: .25rem; color: var(--muted); }
    .metric b { font: 650 .8rem ui-monospace, monospace; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 560px) {
      header, aside, .stage { padding: .75rem; }
      .metrics { grid-template-columns: 1fr; }
      figcaption { align-items: flex-start; flex-direction: column; gap: .2rem; }
    }
  </style>
</head>
<body>
  <header><h1>Perception environment</h1></header>
  <main>
    <aside>
      <h2>Learned rollout</h2>
      <p class="intro">Watch the observed ball and Model 1’s possible hidden paths in the same scene.</p>
      <label>Held-out rollout<select id="rolloutSelect"></select></label>
      <div class="buttons">
        <button class="primary" id="playback">Play rollout</button>
        <button id="reset">Reset</button>
      </div>
      <p class="status" id="statusMessage">Loading learned rollouts…</p>

      <section class="model-two" id="modelTwoPanel" aria-label="Model 2 output">
        <h2>Model 2 · Second-order perception</h2>
        <small>World guess · evaluation with normalized parameters</small>
        <b id="operatorReadout">Waiting for beliefs</b>
        <div class="comparison">
          <div class="comparison-row heading"><span>Operator</span><span>Actual world</span><span>Model 2 guess</span></div>
          <div id="comparisonRows"></div>
        </div>
      </section>
    </aside>

    <section class="stage">
      <figure id="truthPanel">
        <figcaption>
          <strong>Observed rollout + Model 1 beliefs</strong>
          <span id="truthPhase">loading</span>
        </figcaption>
        <canvas id="worldCanvas" width="1200" height="600"></canvas>
        <div class="legend" id="beliefLegend">
          <span><i class="dot" style="background:white"></i>white = observed ball</span>
          <span><i class="dot" style="background:var(--violet)"></i>purple = Model 1’s possible hidden paths</span>
        </div>
        <div class="metrics">
          <div class="metric"><small>Playhead</small><b id="timeReadout">frame 1</b></div>
          <div class="metric"><small>Belief state</small><b id="beliefPhase">pre-belief</b></div>
        </div>
      </figure>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const worldCanvas = $("worldCanvas");
    const worldCtx = worldCanvas.getContext("2d");
    let learnedRollouts = [];
    let learnedData = null;
    let learnedIndex = 0;
    let learnedFrame = 0;
    let playing = false;
    let accumulator = 0;
    let previousTimestamp = 0;

    const worldSlots = [
      {name: "vertical force", activity: 0, parameters: [1]},
      {name: "horizontal force", activity: 2, parameters: [3]},
      {name: "damping", activity: 4, parameters: [5]},
      {name: "right wall", activity: 6, parameters: [7, 8]},
      {name: "floor", activity: 9, parameters: [10, 11]}
    ];

    function decodeBytes(encoded) {
      const raw = atob(encoded);
      return Uint8Array.from(raw, character => character.charCodeAt(0));
    }

    function validateWorldVector(value, name) {
      if (!Array.isArray(value) || value.length !== 12 || !value.every(Number.isFinite)) {
        throw new Error(`${name} must be a finite 12-value world vector`);
      }
    }

    function validateLearnedRollout(rollout) {
      if (!rollout || typeof rollout !== "object" || typeof rollout.example_id !== "string") {
        throw new Error("rollout must have an example ID");
      }
      const truth = rollout.ground_truth;
      const model1 = rollout.model1;
      const model2 = rollout.model2;
      if (!truth || !model1 || !model2) throw new Error("rollout is missing a required model stage");
      if (![truth.width, truth.height, truth.frame_count].every(Number.isInteger)) {
        throw new Error("ground-truth dimensions must be integers");
      }
      if (truth.width < 1 || truth.height < 1 || truth.frame_count < 1) {
        throw new Error("ground-truth dimensions must be positive");
      }
      if (!Number.isInteger(truth.hidden_start)
          || !Number.isInteger(truth.hidden_end)
          || !Number.isInteger(truth.reappearance_step)
          || truth.hidden_start < 0
          || truth.hidden_start > truth.hidden_end
          || truth.hidden_end >= truth.reappearance_step
          || truth.reappearance_step >= truth.frame_count) {
        throw new Error("hidden interval and reappearance must index the clip");
      }
      if (![model1.width, model1.height].every(value => Number.isInteger(value) && value > 0)) {
        throw new Error("belief dimensions must be positive integers");
      }
      validateWorldVector(truth.world_flat, "actual world");
      validateWorldVector(model2.predicted_world_flat, "predicted world");
      const frameBytes = decodeBytes(truth.frames_base64);
      const preBelief = decodeBytes(model1.pre_belief_u8);
      const postBelief = decodeBytes(model1.post_belief_u8);
      if (frameBytes.length !== truth.width * truth.height * truth.frame_count) {
        throw new Error("ground-truth byte length does not match its dimensions");
      }
      if (preBelief.length !== model1.width * model1.height
          || postBelief.length !== model1.width * model1.height) {
        throw new Error("belief byte length does not match its dimensions");
      }
      return {...rollout, frameBytes, preBelief, postBelief};
    }

    function validateLearnedPayload(payload) {
      if (!payload || payload.schema_version !== "learned-demo-v2"
          || !Array.isArray(payload.rollouts) || !payload.rollouts.length) {
        throw new Error("learned rollout payload must use the nonempty v2 schema");
      }
      return payload.rollouts.map(validateLearnedRollout);
    }

    function worldSlotValue(flat, slot) {
      if (flat[slot.activity] < .5) return "off";
      return slot.parameters.map(index => Number(flat[index]).toFixed(2)).join(" · ");
    }

    function comparisonElements(actual, predicted) {
      return worldSlots.map(slot => {
        const row = document.createElement("div");
        row.className = "comparison-row";
        [slot.name, worldSlotValue(actual, slot), worldSlotValue(predicted, slot)].forEach(value => {
          const cell = document.createElement("span");
          cell.textContent = value;
          row.append(cell);
        });
        return row;
      });
    }

    function learnedWorldSummary(flat) {
      const active = worldSlots
        .filter(slot => flat[slot.activity] >= .5)
        .map(slot => `${slot.name} ${worldSlotValue(flat, slot)}`);
      return active.length ? active.join(" · ") : "constant motion";
    }

    function imageBuffer(width, height, values, colorize = false) {
      const buffer = document.createElement("canvas");
      buffer.width = width;
      buffer.height = height;
      const ctx = buffer.getContext("2d");
      const image = ctx.createImageData(width, height);
      values.forEach((value, index) => {
        const cursor = index * 4;
        if (colorize) {
          const normalized = value / 255;
          const intensity = Math.sqrt(normalized);
          image.data[cursor] = 173;
          image.data[cursor + 1] = 146;
          image.data[cursor + 2] = 255;
          image.data[cursor + 3] = Math.round(intensity * 230);
        } else {
          image.data[cursor] = value;
          image.data[cursor + 1] = value;
          image.data[cursor + 2] = value;
          image.data[cursor + 3] = 255;
        }
      });
      ctx.putImageData(image, 0, 0);
      return buffer;
    }

    function drawBeliefOverlay(left, top, side) {
      const truth = learnedData.ground_truth;
      if (!(learnedFrame >= truth.hidden_start && learnedFrame <= truth.hidden_end)) return;
      const postObservation = learnedFrame >= truth.reappearance_step;
      const values = postObservation ? learnedData.postBelief : learnedData.preBelief;
      const beliefBuffer = imageBuffer(
        learnedData.model1.width,
        learnedData.model1.height,
        values,
        true
      );
      worldCtx.save();
      worldCtx.globalCompositeOperation = "screen";
      worldCtx.globalAlpha = .92;
      worldCtx.imageSmoothingEnabled = true;
      worldCtx.imageSmoothingQuality = "high";
      worldCtx.drawImage(beliefBuffer, left, top, side, side);
      worldCtx.restore();
    }

    function drawLearnedWorld() {
      if (!learnedData) return;
      const truth = learnedData.ground_truth;
      const frameSize = truth.width * truth.height;
      const offset = learnedFrame * frameSize;
      const frame = learnedData.frameBytes.slice(offset, offset + frameSize);
      const buffer = imageBuffer(truth.width, truth.height, frame);
      worldCtx.fillStyle = "#05090b";
      worldCtx.fillRect(0, 0, worldCanvas.width, worldCanvas.height);
      const side = Math.min(worldCanvas.width, worldCanvas.height);
      const left = (worldCanvas.width - side) / 2;
      const top = (worldCanvas.height - side) / 2;
      worldCtx.imageSmoothingEnabled = true;
      worldCtx.imageSmoothingQuality = "high";
      worldCtx.drawImage(buffer, left, top, side, side);
      drawBeliefOverlay(left, top, side);
    }

    function updateOutputs() {
      if (!learnedData) return;
      const truth = learnedData.ground_truth;
      const postObservation = learnedFrame >= truth.reappearance_step;
      const hidden = learnedFrame >= truth.hidden_start && learnedFrame <= truth.hidden_end;
      $("timeReadout").textContent = `frame ${learnedFrame + 1} of ${truth.frame_count}`;
      $("beliefPhase").textContent = postObservation ? "post-belief after observation"
        : hidden ? "pre-belief · imagining hidden paths" : "waiting for occlusion";
      $("truthPhase").textContent = `rollout ${learnedIndex + 1} of ${learnedRollouts.length}`;
      $("playback").textContent = playing ? "Pause rollout" : "Play rollout";
      $("statusMessage").textContent = hidden
        ? "The ball is hidden. Purple shows Model 1’s belief beneath the occluder."
        : postObservation
          ? "The ball has reappeared. Model 1 has revised its belief."
          : "The observed ball is approaching the occluder.";
    }

    function draw() {
      drawLearnedWorld();
      updateOutputs();
    }

    function selectLearnedRollout(index) {
      const candidateIndex = Number(index);
      if (!Number.isInteger(candidateIndex) || !learnedRollouts[candidateIndex]) {
        throw new Error("learned rollout selection is out of range");
      }
      const candidate = learnedRollouts[candidateIndex];
      const comparison = comparisonElements(
        candidate.ground_truth.world_flat,
        candidate.model2.predicted_world_flat
      );
      learnedIndex = candidateIndex;
      learnedData = candidate;
      learnedFrame = 0;
      accumulator = 0;
      $("comparisonRows").replaceChildren(...comparison);
      $("operatorReadout").textContent = learnedWorldSummary(candidate.model2.predicted_world_flat);
      draw();
    }

    async function loadLearnedRollouts() {
      try {
        const response = await fetch("learned-example.json");
        if (!response.ok) throw new Error(`rollout request failed: ${response.status}`);
        const payload = await response.json();
        const prepared = validateLearnedPayload(payload);
        const options = prepared.map((rollout, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `Rollout ${index + 1} · ${rollout.example_id}`;
          return option;
        });
        learnedRollouts = prepared;
        $("rolloutSelect").replaceChildren(...options);
        selectLearnedRollout(0);
      } catch (error) {
        playing = false;
        $("statusMessage").textContent =
          "Couldn’t load learned rollouts. Open the demo from http://localhost:8765.";
      }
    }

    function animate(timestamp) {
      if (!previousTimestamp) previousTimestamp = timestamp;
      const elapsed = Math.min((timestamp - previousTimestamp) / 1000, .1);
      previousTimestamp = timestamp;
      if (playing && learnedData) {
        accumulator += elapsed;
        if (accumulator >= .12) {
          learnedFrame = (learnedFrame + 1) % learnedData.ground_truth.frame_count;
          accumulator = 0;
        }
      }
      draw();
      requestAnimationFrame(animate);
    }

    $("playback").addEventListener("click", () => {
      if (!learnedData) return;
      playing = !playing;
      updateOutputs();
    });
    $("reset").addEventListener("click", () => {
      playing = false;
      learnedFrame = 0;
      accumulator = 0;
      draw();
    });
    $("rolloutSelect").addEventListener("change", event => {
      try {
        selectLearnedRollout(event.target.value);
      } catch (error) {
        event.target.value = String(learnedIndex);
        $("statusMessage").textContent = "Couldn’t select that rollout; the previous one remains.";
      }
    });

    loadLearnedRollouts();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
