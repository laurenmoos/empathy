<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perception Environment</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ece8df;
      --ink: #333832;
      --muted: #777970;
      --forest: #3d433d;
      --forest-muted: #d0d1cb;
      --line: #b4b3a9;
      --canvas: #dbd8d0;
      --belief: #8b9186;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { padding: 1rem 1.35rem; color: #f2efe7; background: var(--forest); border-bottom: 1px solid #565d56; }
    h1 { margin: 0; font: 500 1.18rem/1.1 Georgia, serif; letter-spacing: -.02em; }
    main { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: calc(100vh - 3.2rem); }
    aside { padding: 1.35rem; color: #f2efe7; background: var(--forest); }
    h2 { margin: 0; font: 500 .95rem/1.2 Georgia, serif; }
    aside h2 { margin-bottom: 1.35rem; }
    .control { display: grid; grid-template-columns: 1fr 4.8rem; align-items: center; gap: .8rem; margin-top: .9rem; color: var(--forest-muted); font-size: .72rem; }
    input[type="number"] {
      width: 100%;
      padding: .48rem .55rem;
      color: #f2efe7;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #737a73;
      border-radius: 0;
      font: 650 .72rem ui-monospace, monospace;
    }
    button {
      width: 100%;
      padding: .62rem .7rem;
      color: var(--forest-muted);
      background: transparent;
      border: 1px solid #737a73;
      border-radius: 2px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { color: var(--forest); background: #d9d9d1; border-color: transparent; }
    button:disabled { cursor: wait; opacity: .6; }
    .buttons { display: grid; gap: .45rem; margin-top: .9rem; }
    .status { min-height: 3.6em; margin: .65rem 0 0; color: #aeb2aa; font-size: .7rem; line-height: 1.4; }
    .layers {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(17rem, .7fr);
      gap: 1.4rem;
      padding: 1.5rem;
      align-items: start;
    }
    .panel {
      min-width: 0;
      padding-top: .75rem;
      border-top: 1px solid var(--line);
      background: transparent;
    }
    .panel-head { min-height: 2.5rem; margin-bottom: .65rem; }
    .panel-head span { display: block; margin-top: .25rem; color: var(--muted); font-size: .68rem; line-height: 1.35; }
    canvas { display: block; width: 100%; aspect-ratio: 1.2; background: var(--canvas); }
    .readout { min-height: 2.4em; font: 500 .76rem ui-monospace, monospace; color: var(--forest); }
    .comparison { margin-top: .7rem; }
    .comparison-row { display: grid; grid-template-columns: 1fr .85fr .85fr; gap: .25rem; padding: .55rem 0; border-top: 1px solid var(--line); font-size: .66rem; }
    .comparison-row.heading { color: var(--muted); border-top: 0; }
    .comparison-row span:not(:first-child) { font-family: ui-monospace, monospace; }
    @media (max-width: 1080px) {
      .layers { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .layers { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header><h1>Perception environment</h1></header>
  <main>
    <aside>
      <h2>Fixed world</h2>
      <label class="control">
        <span>Gravity</span>
        <input id="gravity" type="number" min="-0.30" max="0.30" step="0.02" value="-0.06">
      </label>
      <label class="control">
        <span>Wind</span>
        <input id="wind" type="number" min="-0.30" max="0.30" step="0.05" value="0.00">
      </label>
      <label class="control">
        <span>Damping</span>
        <input id="damping" type="number" min="0" max="0.60" step="0.05" value="0.00">
      </label>
      <div class="buttons">
        <button class="primary" id="streamToggle">Play thinking stream</button>
        <button id="reset">Reset stream</button>
      </div>
      <p class="status" id="statusMessage"></p>
    </aside>

    <section class="layers">
      <article class="panel" id="perceptionPanel">
        <div class="panel-head">
          <h2>Ground truth + beliefs</h2>
          <span id="worldPhase"></span>
        </div>
        <canvas id="perceptionCanvas" width="768" height="640"></canvas>
      </article>

      <article class="panel" id="secondOrderPanel">
        <div class="panel-head">
          <h2>Second-order perception</h2>
        </div>
        <div class="readout" id="operatorReadout">—</div>
        <div class="comparison">
          <div class="comparison-row heading"><span>Operator</span><span>Ground-truth parameters</span><span>Pre-update guess</span></div>
          <div id="comparisonRows"></div>
        </div>
      </article>
    </section>
  </main>

  <script src="explorer_state.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const perceptionCanvas = $("perceptionCanvas");
    const perceptionCtx = perceptionCanvas.getContext("2d");
    const {frameNarration} = PerceptionUIState;
    const EXPECTED_THOUGHT_LABELS = [
      "first possibility",
      "more possibilities",
      "full belief",
      "reappearance revision"
    ];
    const worldSlots = [
      {name: "gravity", operator: "vertical_acceleration", parameter: "a_y", parameterIndex: 0, minimum: -1, maximum: 1},
      {name: "wind", operator: "horizontal_acceleration", parameter: "a_x", parameterIndex: 1, minimum: -1, maximum: 1},
      {name: "damping", operator: "damping", parameter: "lambda", parameterIndex: 2, minimum: 0, maximum: 1}
    ];

    let sessionId = null;
    let episodeQueue = [];
    let currentEpisode = null;
    let currentFrame = 0;
    let currentThought = -1;
    let playing = false;
    let fetching = false;
    let requestSerial = 0;
    let statusOverride = null;
    let accumulator = 0;
    let previousTimestamp = 0;

    function decodeBytes(encoded) {
      const raw = atob(encoded);
      return Uint8Array.from(raw, character => character.charCodeAt(0));
    }

    function validateWorldVector(value, name) {
      if (!Array.isArray(value) || value.length !== 12 || !value.every(Number.isFinite)) {
        throw new Error(`${name} must be a finite 12-value world vector`);
      }
    }

    function validateLiveEpisode(payload) {
      if (!payload || payload.schema_version !== "live-thinking-v1") {
        throw new Error("episode response must use the live thinking v1 schema");
      }
      if (!Number.isInteger(payload.episode_index)
          || !Array.isArray(payload.initial_state)
          || payload.initial_state.length !== 4
          || !payload.initial_state.every(Number.isFinite)) {
        throw new Error("episode index and initial_state are invalid");
      }
      const truth = payload.ground_truth;
      if (!truth || ![truth.width, truth.height, truth.frame_count].every(Number.isInteger)) {
        throw new Error("ground-truth dimensions must be integers");
      }
      if (!Array.isArray(truth.path) || truth.path.length < 2
          || !truth.path.every(point => Array.isArray(point)
            && point.length === 2
            && point.every(value => Number.isFinite(value) && value >= 0 && value <= 1))) {
        throw new Error("ground-truth path must contain normalized x/y points");
      }
      if (!Number.isInteger(truth.hidden_start)
          || !Number.isInteger(truth.hidden_end)
          || !Number.isInteger(truth.reappearance_step)
          || truth.hidden_start < 0
          || truth.hidden_start > truth.hidden_end
          || truth.hidden_end >= truth.reappearance_step
          || truth.reappearance_step >= truth.frame_count) {
        throw new Error("hidden interval and reappearance must index the clip");
      }
      validateWorldVector(truth.world_flat, "actual world");
      const frameBytes = decodeBytes(truth.frames_base64);
      if (frameBytes.length !== truth.width * truth.height * truth.frame_count) {
        throw new Error("frame byte length does not match dimensions");
      }
      if (!Array.isArray(payload.thought_steps) || payload.thought_steps.length !== 4) {
        throw new Error("episode must contain four thought steps");
      }
      const thoughtSteps = payload.thought_steps.map((step, index) => {
        if (!step || step.label !== EXPECTED_THOUGHT_LABELS[index]
            || !Number.isInteger(step.width) || !Number.isInteger(step.height)) {
          throw new Error("thought step order or dimensions are invalid");
        }
        validateWorldVector(step.predicted_world_flat, "predicted world");
        if (!Array.isArray(step.predicted_parameters)
            || step.predicted_parameters.length !== 7
            || !step.predicted_parameters.every(Number.isFinite)) {
          throw new Error("predicted parameters must contain seven finite values");
        }
        if (!Array.isArray(step.paths) || step.paths.length < 1
            || !step.paths.every(path => Array.isArray(path) && path.length > 1
              && path.every(point => Array.isArray(point) && point.length === 2
                && point.every(value => Number.isFinite(value)
                  && value >= 0 && value <= 1)))
            || !Array.isArray(step.path_weights)
            || step.path_weights.length !== step.paths.length
            || !step.path_weights.every(value => Number.isFinite(value) && value >= 0)) {
          throw new Error("belief paths and weights are invalid");
        }
        const beliefBytes = decodeBytes(step.belief_u8);
        if (beliefBytes.length !== step.width * step.height) {
          throw new Error("belief byte length does not match dimensions");
        }
        return {...step, beliefBytes};
      });
      if (!payload.training || !Number.isFinite(payload.training.loss)
          || !Number.isInteger(payload.latent_update_count)
          || !Number.isInteger(payload.weight_update_count)) {
        throw new Error("online update metadata is invalid");
      }
      return {...payload, ground_truth: {...truth, frameBytes}, thought_steps: thoughtSteps};
    }

    function selectedParameters() {
      return {
        gravity: Number($("gravity").value),
        wind: Number($("wind").value),
        damping: Number($("damping").value)
      };
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `request failed: ${response.status}`);
      return payload;
    }

    async function startSession() {
      const serial = ++requestSerial;
      sessionId = null;
      episodeQueue.length = 0;
      currentEpisode = null;
      currentFrame = 0;
      currentThought = -1;
      playing = false;
      fetching = false;
      statusOverride = null;
      clearAllLayers();
      $("streamToggle").disabled = true;
      $("statusMessage").textContent = "Starting a fixed-world thinking session…";
      try {
        const payload = await postJson("/api/session/start", selectedParameters());
        if (serial !== requestSerial) return;
        if (payload.schema_version !== "live-session-v1" || typeof payload.session_id !== "string") {
          throw new Error("session response is invalid");
        }
        sessionId = payload.session_id;
        playing = true;
        $("statusMessage").textContent = "Generating the first offset episode…";
        await requestNextEpisode();
      } catch (error) {
        if (serial !== requestSerial) return;
        playing = false;
        sessionId = null;
        statusOverride = `Couldn’t start the stream: ${error.message}`;
        $("statusMessage").textContent = statusOverride;
      } finally {
        if (serial === requestSerial) $("streamToggle").disabled = false;
        updateControls();
      }
    }

    async function requestNextEpisode() {
      if (!sessionId || fetching) return;
      const serial = requestSerial;
      const targetSession = sessionId;
      fetching = true;
      try {
        const payload = await postJson("/api/session/next", {session_id: targetSession});
        if (serial !== requestSerial || targetSession !== sessionId) return;
        const episode = validateLiveEpisode(payload);
        if (!currentEpisode) setCurrentEpisode(episode);
        else episodeQueue.push(episode);
      } catch (error) {
        if (serial !== requestSerial) return;
        playing = false;
        statusOverride = `Stream stopped: ${error.message}`;
        $("statusMessage").textContent = statusOverride;
      } finally {
        if (serial === requestSerial) fetching = false;
        updateControls();
      }
    }

    function setCurrentEpisode(episode) {
      currentEpisode = episode;
      currentFrame = 0;
      currentThought = -1;
      accumulator = 0;
      $("statusMessage").textContent = "The ball is approaching the occluder.";
      draw();
      requestNextEpisode();
    }

    function advanceEpisode() {
      if (episodeQueue.length) {
        setCurrentEpisode(episodeQueue.shift());
        return;
      }
      $("statusMessage").textContent = "Generating another offset…";
      requestNextEpisode();
    }

    function imageBuffer(width, height, values, colorize = false) {
      const buffer = document.createElement("canvas");
      buffer.width = width;
      buffer.height = height;
      const ctx = buffer.getContext("2d");
      const image = ctx.createImageData(width, height);
      values.forEach((value, index) => {
        const cursor = index * 4;
        if (colorize) {
          const intensity = Math.sqrt(value / 255);
          image.data[cursor] = 139;
          image.data[cursor + 1] = 145;
          image.data[cursor + 2] = 134;
          image.data[cursor + 3] = Math.round(intensity * 205);
        } else {
          const intensity = value / 255;
          image.data[cursor] = Math.round(219 + (61 - 219) * intensity);
          image.data[cursor + 1] = Math.round(216 + (67 - 216) * intensity);
          image.data[cursor + 2] = Math.round(208 + (61 - 208) * intensity);
          image.data[cursor + 3] = 255;
        }
      });
      ctx.putImageData(image, 0, 0);
      return buffer;
    }

    function clearPerceptionCanvas() {
      perceptionCtx.fillStyle = "#dbd8d0";
      perceptionCtx.fillRect(0, 0, perceptionCanvas.width, perceptionCanvas.height);
      $("worldPhase").textContent = "";
    }

    function clearSecondOrder() {
      $("operatorReadout").textContent = "";
      $("comparisonRows").replaceChildren();
    }

    function clearAllLayers() {
      clearPerceptionCanvas();
      clearSecondOrder();
    }

    function drawGroundTruthPath(path) {
      perceptionCtx.save();
      perceptionCtx.beginPath();
      path.forEach(([x, y], index) => {
        const px = x * perceptionCanvas.width;
        const py = (1 - y) * perceptionCanvas.height;
        if (index === 0) perceptionCtx.moveTo(px, py);
        else perceptionCtx.lineTo(px, py);
      });
      perceptionCtx.strokeStyle = "#333832";
      perceptionCtx.lineWidth = 2.2;
      perceptionCtx.lineCap = "round";
      perceptionCtx.lineJoin = "round";
      perceptionCtx.stroke();
      perceptionCtx.restore();
    }

    function strokePath(path, width, alpha) {
      perceptionCtx.save();
      perceptionCtx.beginPath();
      path.forEach(([x, y], index) => {
        const px = x * perceptionCanvas.width;
        const py = (1 - y) * perceptionCanvas.height;
        if (index === 0) perceptionCtx.moveTo(px, py);
        else perceptionCtx.lineTo(px, py);
      });
      perceptionCtx.strokeStyle = "#788076";
      perceptionCtx.lineWidth = width;
      perceptionCtx.globalAlpha = alpha;
      perceptionCtx.lineCap = "round";
      perceptionCtx.lineJoin = "round";
      perceptionCtx.stroke();
      perceptionCtx.restore();
    }

    function beliefConfidence(weights) {
      if (weights.length === 1) return 1;
      const entropy = -weights.reduce(
        (total, weight) => total + (weight > 0 ? weight * Math.log(weight) : 0),
        0
      );
      return Math.max(0, Math.min(1, 1 - entropy / Math.log(weights.length)));
    }

    function drawBeliefSuperposition(step) {
      const confidence = beliefConfidence(step.path_weights);
      step.paths.forEach((path, index) => {
        const weight = step.path_weights[index];
        const broadWidth = 5 + (1 - confidence) * 11 + (1 - weight) * 3;
        const broadAlpha = .07 + confidence * .12 + weight * .12;
        strokePath(path, broadWidth, broadAlpha);
        strokePath(path, 1.2 + weight * 2.2, .12 + confidence * .28 + weight * .38);
      });
    }

    function drawPerception() {
      if (!currentEpisode) return clearPerceptionCanvas();
      const truth = currentEpisode.ground_truth;
      const frameSize = truth.width * truth.height;
      const offset = currentFrame * frameSize;
      const frame = truth.frameBytes.slice(offset, offset + frameSize);
      const buffer = imageBuffer(truth.width, truth.height, frame);
      perceptionCtx.fillStyle = "#dbd8d0";
      perceptionCtx.fillRect(0, 0, perceptionCanvas.width, perceptionCanvas.height);
      perceptionCtx.imageSmoothingEnabled = true;
      perceptionCtx.imageSmoothingQuality = "high";
      perceptionCtx.drawImage(buffer, 0, 0, perceptionCanvas.width, perceptionCanvas.height);
      const hidden = currentFrame >= truth.hidden_start && currentFrame <= truth.hidden_end;
      const index = thoughtIndex();
      if (index >= 0) {
        const step = currentEpisode.thought_steps[index];
        drawBeliefSuperposition(step);
        if (index !== currentThought) {
          currentThought = index;
          updateSecondOrder(step);
        }
      }
      drawGroundTruthPath(truth.path);
      $("worldPhase").textContent = hidden
        ? "Ball hidden · the world continues"
        : currentFrame >= truth.reappearance_step
          ? "Ball reappeared · evidence arrives"
          : "Ball visible";
      $("statusMessage").textContent = frameNarration(
        hidden,
        currentFrame >= truth.reappearance_step,
        statusOverride
      );
    }

    function thoughtIndex() {
      if (!currentEpisode) return -1;
      const truth = currentEpisode.ground_truth;
      if (currentFrame < truth.hidden_start) return -1;
      if (currentFrame >= truth.reappearance_step) return 3;
      const hiddenLength = Math.max(1, truth.hidden_end - truth.hidden_start + 1);
      const progress = (currentFrame - truth.hidden_start) / hiddenLength;
      return Math.min(2, Math.floor(progress * 3));
    }

    function worldSlotValue(operators, slot) {
      const operator = operators[slot.operator];
      if (!operator || !operator.active) return "0.00";
      return Number(operator.parameters[slot.parameter]).toFixed(2);
    }

    function predictedParameterValue(parameters, slot) {
      const normalized = Math.max(0, Math.min(1, Number(parameters[slot.parameterIndex])));
      return (slot.minimum + normalized * (slot.maximum - slot.minimum)).toFixed(2);
    }

    function comparisonElements(actual, predictedParameters) {
      return worldSlots.map(slot => {
        const row = document.createElement("div");
        row.className = "comparison-row";
        [slot.name, worldSlotValue(actual, slot), predictedParameterValue(predictedParameters, slot)].forEach(value => {
          const cell = document.createElement("span");
          cell.textContent = value;
          row.append(cell);
        });
        return row;
      });
    }

    function worldSummary(parameters) {
      return worldSlots
        .map(slot => `${slot.name} ${predictedParameterValue(parameters, slot)}`)
        .join(" · ");
    }

    function updateSecondOrder(step) {
      $("operatorReadout").textContent = worldSummary(step.predicted_parameters);
      $("comparisonRows").replaceChildren(
        ...comparisonElements(
          currentEpisode.ground_truth.operators,
          step.predicted_parameters
        )
      );
    }

    function draw() {
      drawPerception();
    }

    function animate(timestamp) {
      if (!previousTimestamp) previousTimestamp = timestamp;
      const elapsed = Math.min((timestamp - previousTimestamp) / 1000, .1);
      previousTimestamp = timestamp;
      if (playing && currentEpisode) {
        accumulator += elapsed;
        if (accumulator >= .14) {
          accumulator = 0;
          if (currentFrame < currentEpisode.ground_truth.frame_count - 1) {
            currentFrame += 1;
          } else {
            advanceEpisode();
          }
        }
      }
      draw();
      requestAnimationFrame(animate);
    }

    function updateControls() {
      $("streamToggle").textContent = !sessionId
        ? "Play thinking stream"
        : playing ? "Pause thinking stream" : "Resume thinking stream";
    }

    function stopAndClear(message) {
      const previousSession = sessionId;
      requestSerial += 1;
      sessionId = null;
      episodeQueue.length = 0;
      currentEpisode = null;
      currentFrame = 0;
      currentThought = -1;
      playing = false;
      fetching = false;
      statusOverride = message;
      clearPerceptionCanvas();
      clearSecondOrder();
      $("statusMessage").textContent = message;
      $("streamToggle").disabled = false;
      updateControls();
      if (previousSession) {
        postJson("/api/session/close", {session_id: previousSession}).catch(() => {});
      }
    }

    $("streamToggle").addEventListener("click", () => {
      if (!sessionId) {
        startSession();
        return;
      }
      statusOverride = null;
      playing = !playing;
      if (playing && !currentEpisode) requestNextEpisode();
      updateControls();
    });
    $("reset").addEventListener("click", () => {
      stopAndClear("Stream reset. Start again when ready.");
    });

    ["gravity", "wind", "damping"].forEach(id => {
      $(id).addEventListener("input", () => {
        stopAndClear("Parameters changed. Start a new thinking stream.");
      });
    });

    clearAllLayers();
    updateControls();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
