[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perception-env"
version = "0.1.0"
description = "Visually inspectable toy worlds for second-order perceptual coherence research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
perception-env = "perception_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/perception_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

